services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_test_officer
      POSTGRES_USER: ai_test_officer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ai_test_officer"], interval: 3s, timeout: 3s, retries: 30 }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [control]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"], interval: 3s, timeout: 3s, retries: 30 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}" }
    volumes: ["redis-data:/data"]
    networks: [control]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"], interval: 3s, timeout: 3s, retries: 30 }
    volumes: ["minio-data:/data"]
    networks: [control]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY && mc mb --ignore-existing local/ai-test-officer && mc anonymous set none local/ai-test-officer"]
    environment: { MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}", MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}" }
    networks: [control]
  egress-proxy:
    build: { context: ../egress-proxy, dockerfile: Dockerfile }
    environment:
      PORT: "3128"
      ATO_EGRESS_ALLOWED_HOSTS: "example.com"
      ATO_EGRESS_ALLOWED_PORTS: "80,443"
      ATO_EGRESS_POLICY_SECRET: ${EGRESS_POLICY_SECRET:?set EGRESS_POLICY_SECRET}
      ATO_EGRESS_AUDIT_FILE: /var/log/ato/egress.jsonl
    volumes: ["egress-audit:/var/log/ato"]
    networks: [egress]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"], interval: 3s, timeout: 3s, retries: 30 }
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    # The stock Keycloak image is already runnable. Enabling the build-time
    # health feature here forces a full Quarkus augmentation on every fresh
    # acceptance container (often > 1 minute on a laptop). The acceptance
    # runner polls the real token endpoint, which is the authoritative
    # readiness signal for the OIDC path we exercise.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:18080
    volumes: ["./keycloak-realm.json:/opt/keycloak/data/import/ai-test-officer-realm.json:ro"]
    ports: ["127.0.0.1:18080:8080"]
    networks: [control]
  todo-lite:
    build: { context: ../.., dockerfile: Dockerfile.production, target: benchmark-target }
    command: ["node", "fixtures/todo-lite/server.mjs"]
    environment: { HOST: 0.0.0.0, PORT: 7101 }
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:7101/health"], interval: 3s, timeout: 3s, retries: 30 }
    networks: [targets]
  order-portal-lite:
    build: { context: ../.., dockerfile: Dockerfile.production, target: benchmark-target }
    command: ["node", "fixtures/order-portal-lite/server.mjs"]
    environment: { HOST: 0.0.0.0, PORT: 7102 }
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:7102/health"], interval: 3s, timeout: 3s, retries: 30 }
    networks: [targets]
  customer-portal-lite:
    build: { context: ../.., dockerfile: Dockerfile.production, target: benchmark-target }
    command: ["node", "fixtures/customer-portal-lite/server.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 7103
      TARGET_DATABASE_URL: postgresql://target_app:${TARGET_DB_PASSWORD}@target-db:5432/target_app
    depends_on:
      target-db-init: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:7103/health"], interval: 3s, timeout: 3s, retries: 30 }
    networks: [targets]
  target-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: target_app
      POSTGRES_USER: target_app
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:?set TARGET_DB_PASSWORD}
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U target_app -d target_app"], interval: 3s, timeout: 3s, retries: 30 }
    volumes: ["target-db-data:/var/lib/postgresql/data"]
    networks: [targets]
  target-db-init:
    image: postgres:16-alpine
    depends_on: { target-db: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql \"postgresql://target_app:$$TARGET_DB_PASSWORD@target-db:5432/target_app\" -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS customers (id integer PRIMARY KEY, name text NOT NULL, amount integer NOT NULL);' -c \"INSERT INTO customers (id, name, amount) VALUES (1, 'Globex Expansion', 1200), (2, 'Acme Renewal', 9800) ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, amount = EXCLUDED.amount;\""]
    environment: { TARGET_DB_PASSWORD: "${TARGET_DB_PASSWORD:?set TARGET_DB_PASSWORD}" }
    networks: [targets]
  reports-init:
    build: { context: ../.., dockerfile: Dockerfile.production }
    user: root
    command: ["/bin/sh", "-c", "mkdir -p /app/reports && chown -R pwuser:pwuser /app/reports"]
    read_only: true
    volumes: ["agent-reports:/app/reports"]
    networks: [control]
  agent-api: &agent
    build: { context: ../.., dockerfile: Dockerfile.production }
    command: ["/bin/sh", "-c", "npm --workspace @ai-test-officer/agent run migrate && node agent/dist/server.js"]
    environment: &agent-env
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4317
      DATABASE_URL: postgresql://ai_test_officer:${POSTGRES_PASSWORD}@postgres:5432/ai_test_officer
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUN_WORKER_IN_PROCESS: "0"
      AGENT_ORCHESTRATION_MODE: active
      LANGGRAPH_POSTGRES_SCHEMA: langgraph
      REPAIR_SANDBOX_ENABLED: "true"
      REPAIR_HOST_APPLY_ENABLED: "false"
      RUN_EVIDENCE_ED25519_PRIVATE_KEY: ${RUN_EVIDENCE_ED25519_PRIVATE_KEY:?set RUN_EVIDENCE_ED25519_PRIVATE_KEY}
      RUN_EVIDENCE_ED25519_PUBLIC_KEY: ${RUN_EVIDENCE_ED25519_PUBLIC_KEY:?set RUN_EVIDENCE_ED25519_PUBLIC_KEY}
      RUN_EVIDENCE_SIGNING_KEY_ID: production-acceptance
      OIDC_ISSUER: http://localhost:18080/realms/ai-test-officer
      OIDC_AUDIENCE: ai-test-officer-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/ai-test-officer/protocol/openid-connect/certs
      OIDC_ROLE_CLAIM: roles
      OIDC_ORGANIZATION_CLAIM: organization_id
      # The endpoint only exposes low-cardinality SLO gauges and is explicitly
      # public for the in-network Prometheus scraper. Run/evidence APIs remain
      # behind OIDC authentication.
      METRICS_PUBLIC: "1"
      ARTIFACT_S3_BUCKET: ai-test-officer
      ARTIFACT_S3_ENDPOINT: http://minio:9000
      ARTIFACT_S3_FORCE_PATH_STYLE: "1"
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:?set INTERNAL_WORKER_TOKEN}
      ALLOWED_ORIGINS: http://localhost:16174
      HEADLESS: "1"
      TRACE: "1"
      # Disabled in normal deployments. The isolated acceptance runner enables
      # this only for exact tagged Run/event pairs to prove recovery after a
      # committed Gate or human approval before the Graph can checkpoint.
      FAULT_INJECTION_ENABLED: "${FAULT_INJECTION_ENABLED:-0}"
      FAULT_INJECTION_RULES_B64: "${FAULT_INJECTION_RULES_B64:-}"
      JUDGING_RECOVERY_GRACE_MS: "${JUDGING_RECOVERY_GRACE_MS:-120000}"
      PLAN_APPROVAL_RESUME_RECOVERY_GRACE_MS: "${PLAN_APPROVAL_RESUME_RECOVERY_GRACE_MS:-120000}"
      ATO_EGRESS_PROXY_URL: http://egress-proxy:3128
      ATO_EGRESS_PROXY_CONTAINER_NAME: egress-proxy
      ATO_EGRESS_POLICY_SECRET: ${EGRESS_POLICY_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      reports-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }
      egress-proxy: { condition: service_healthy }
    read_only: true
    restart: unless-stopped
    tmpfs: ["/tmp"]
    volumes: ["agent-reports:/app/reports"]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:4317/api/health"], interval: 5s, timeout: 3s, retries: 30 }
    ports: ["127.0.0.1:14317:4317"]
    networks: [control, targets, egress]
    # Keep the acceptance topology valid for both Docker Compose v1 and v2.
    # The ephemeral project name already isolates the stack; v1 rejects the
    # Compose-v2-only top-level `name` field and the `pids` limit.
    deploy: { resources: { limits: { cpus: "2", memory: 4G } } }
  worker:
    <<: *agent
    command: ["node", "agent/dist/workerCli.js"]
    environment:
      <<: *agent-env
      RUN_WORKER_IN_PROCESS: "0"
    depends_on:
      agent-api: { condition: service_healthy }
    ports: []
    healthcheck: { disable: true }
  workbench:
    build: { context: ../.., dockerfile: Dockerfile.production }
    # The production filesystem is read-only. Vite's default bundled config
    # loader writes a temporary module under node_modules and exits with EROFS;
    # runner mode loads the already-built config without mutating the image.
    command: ["npm", "--workspace", "workbench-ui", "exec", "vite", "--", "preview", "--host", "0.0.0.0", "--port", "6174", "--configLoader", "runner"]
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:16174:6174"]
    networks: [control]
  prometheus:
    image: prom/prometheus:v2.53.4
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    depends_on:
      agent-api: { condition: service_healthy }
    volumes:
      - prometheus-data:/prometheus
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    ports: ["127.0.0.1:19090:9090"]
    networks: [control]
  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    depends_on: { prometheus: { condition: service_started } }
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-acceptance-only}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/ato-slo-dashboard.json:/var/lib/grafana/dashboards/ato-slo-dashboard.json:ro
    ports: ["127.0.0.1:13000:3000"]
    networks: [control]
volumes: { postgres-data: {}, redis-data: {}, minio-data: {}, agent-reports: {}, target-db-data: {}, egress-audit: {}, prometheus-data: {}, grafana-data: {} }
networks:
  control: { internal: false }
  targets: { internal: true }
  egress: { internal: false }
