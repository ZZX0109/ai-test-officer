<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">AI Test Officer：目标工作流与待修补边界</title>
  <desc id="workflow-description">目标工作流从项目与需求开始，经过范围确认、隔离执行、证据与断言、机器判定与人工复核，到修复与回归。主体代码已存在，完整闭环仍在整改验收。关键待修补边界包括确认范围一致性、身份与证据授权、跨进程取消与恢复、补丁与验证版本绑定。本图是工作流说明，不表示功能已通过验收。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FE"/>
      <stop offset="1" stop-color="#EDF3FA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#7292B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .heading { fill: #142D4E; font-weight: 650; }
      .body { fill: #536B87; font-size: 16px; }
      .card { fill: #FFFFFF; stroke: #D7E2F0; stroke-width: 1.5; }
      .step-number { fill: #2D5F99; font-size: 18px; font-weight: 650; letter-spacing: 1px; }
      .step-title { fill: #18385B; font-size: 21px; font-weight: 650; }
      .step-detail { fill: #536B87; font-size: 15px; }
      .boundary-title { fill: #25476D; font-size: 18px; font-weight: 600; }
      .boundary-detail { fill: #60748C; font-size: 14px; }
    </style>
  </defs>

  <rect width="1400" height="788" fill="url(#background)"/>
  <rect x="60" y="54" width="5" height="26" rx="2.5" fill="#3973B9"/>
  <text x="79" y="74" fill="#3973B9" font-size="17" font-weight="650" letter-spacing="2">AI TEST OFFICER</text>
  <text x="60" y="143" class="heading" font-size="42">从测试范围到可复验的修复</text>
  <text x="60" y="181" class="body">项目代码、实际执行与独立证据，共同构成测试和修复的目标闭环。</text>
  <rect x="1160" y="61" width="180" height="34" rx="17" fill="#E5EDF8"/>
  <text x="1250" y="83" text-anchor="middle" fill="#41658E" font-size="14" font-weight="600">工作流说明 · 整改中</text>

  <g fill="none" stroke="#7292B7" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M255 339 H271"/>
    <path d="M473 339 H489"/>
    <path d="M691 339 H707"/>
    <path d="M909 339 H925"/>
    <path d="M1127 339 H1143"/>
  </g>

  <g>
    <rect x="60" y="237" width="190" height="207" rx="18" class="card"/>
    <rect x="80" y="257" width="42" height="38" rx="11" fill="#EDF3FC"/>
    <text x="101" y="282" text-anchor="middle" class="step-number">01</text>
    <text x="80" y="335" class="step-title">项目与需求</text>
    <text x="80" y="373" class="step-detail">仓库、应用与业务输入</text>
    <text x="80" y="398" class="step-detail">识别能力与待测路径</text>
  </g>
  <g>
    <rect x="278" y="237" width="190" height="207" rx="18" class="card"/>
    <rect x="298" y="257" width="42" height="38" rx="11" fill="#EDF3FC"/>
    <text x="319" y="282" text-anchor="middle" class="step-number">02</text>
    <text x="298" y="335" class="step-title">范围确认</text>
    <text x="298" y="373" class="step-detail">审阅路径、排除与权限</text>
    <text x="298" y="398" class="step-detail">锁定本次执行的计划</text>
  </g>
  <g>
    <rect x="496" y="237" width="190" height="207" rx="18" class="card"/>
    <rect x="516" y="257" width="42" height="38" rx="11" fill="#EDF3FC"/>
    <text x="537" y="282" text-anchor="middle" class="step-number">03</text>
    <text x="516" y="335" class="step-title">隔离执行</text>
    <text x="516" y="373" class="step-detail">启动真实应用与依赖</text>
    <text x="516" y="398" class="step-detail">执行浏览器与接口检查</text>
  </g>
  <g>
    <rect x="714" y="237" width="190" height="207" rx="18" class="card"/>
    <rect x="734" y="257" width="42" height="38" rx="11" fill="#EDF3FC"/>
    <text x="755" y="282" text-anchor="middle" class="step-number">04</text>
    <text x="734" y="335" class="step-title">证据与断言</text>
    <text x="734" y="373" class="step-detail">关联轨迹、截图与结果</text>
    <text x="734" y="398" class="step-detail">以明确规则检验预期</text>
  </g>
  <g>
    <rect x="932" y="237" width="190" height="207" rx="18" class="card"/>
    <rect x="952" y="257" width="42" height="38" rx="11" fill="#EDF3FC"/>
    <text x="973" y="282" text-anchor="middle" class="step-number">05</text>
    <text x="952" y="335" fill="#18385B" font-size="17" font-weight="650">机器判定 / 人工复核</text>
    <text x="952" y="373" class="step-detail">汇总规则与模型判断</text>
    <text x="952" y="398" class="step-detail">处理失败与待确认项</text>
  </g>
  <g>
    <rect x="1150" y="237" width="190" height="207" rx="18" fill="#F9FCFF" stroke="#9FBADA" stroke-width="1.5"/>
    <rect x="1170" y="257" width="42" height="38" rx="11" fill="#E3EDFA"/>
    <text x="1191" y="282" text-anchor="middle" class="step-number">06</text>
    <text x="1170" y="335" class="step-title">修复与回归</text>
    <text x="1170" y="373" class="step-detail">生成补丁、复验与回归</text>
    <text x="1170" y="398" class="step-detail">交付绑定版本的结果</text>
  </g>

  <text x="60" y="510" class="heading" font-size="19">关键待修补边界</text>
  <path d="M238 503 H1340" stroke="#D4DFED" stroke-width="1"/>
  <g>
    <rect x="60" y="535" width="308" height="100" rx="13" fill="#E7EEF8"/>
    <text x="80" y="570" class="boundary-title">确认范围一致性</text>
    <text x="80" y="601" class="boundary-detail">编辑、确认快照与实际执行保持一致</text>
  </g>
  <g>
    <rect x="384" y="535" width="308" height="100" rx="13" fill="#E7EEF8"/>
    <text x="404" y="570" class="boundary-title">身份与证据授权</text>
    <text x="404" y="601" class="boundary-detail">组织身份贯穿请求、事件流和下载</text>
  </g>
  <g>
    <rect x="708" y="535" width="308" height="100" rx="13" fill="#E7EEF8"/>
    <text x="728" y="570" class="boundary-title">跨进程取消 / 恢复</text>
    <text x="728" y="601" class="boundary-detail">停止真实资源，重启后收敛任务状态</text>
  </g>
  <g>
    <rect x="1032" y="535" width="308" height="100" rx="13" fill="#E7EEF8"/>
    <text x="1052" y="570" class="boundary-title">补丁与验证版本绑定</text>
    <text x="1052" y="601" class="boundary-detail">修改即失效，交付内容对应验证记录</text>
  </g>

  <path d="M60 687 H1340" stroke="#CCD9E9" stroke-width="1"/>
  <circle cx="68" cy="729" r="5" fill="#B8873F"/>
  <text x="85" y="735" fill="#4E647F" font-size="17" font-weight="550">目标工作流 · 主体代码已存在，完整闭环仍在整改验收</text>
  <text x="1340" y="735" text-anchor="end" fill="#6C8098" font-size="14">以真实执行与独立复验为验收依据</text>
</svg>
